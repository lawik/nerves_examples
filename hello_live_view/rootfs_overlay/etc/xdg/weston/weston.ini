# Weston picks this up via $XDG_CONFIG_DIRS/weston/weston.ini (default
# /etc/xdg), which is where this overlay lands. HelloLiveView.Kiosk starts
# weston without --config, so the default search applies.

[output]
# Raspberry Pi Touch Display 2. The connector is card1-DSI-1, so the output
# name is DSI-1 -- not HDMI-A-1. The panel is natively 720x1280 portrait;
# rotate-270 turns it landscape. Use rotate-90 if it comes out upside down.
name=DSI-1
transform=rotate-270
